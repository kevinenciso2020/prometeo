name = "prometeo-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# nodejs_compat NO es necesario: todo usa Web Crypto + fetch.

[vars]
ENVIRONMENT = "development"
# Origen exacto del frontend (CORS + verificación de Origin). En producción: https://<dominio>
WEB_ORIGIN = "http://localhost:4321"
# Base para los enlaces de los correos.
WEB_URL = "http://localhost:4321"
EMAIL_FROM = "Prometeo <no-reply@prometeo.local>"
# En producción: ".<dominio>" para compartir cookies con el front. En local déjalo vacío.
COOKIE_DOMAIN = ""
# Nombre de tu cuenta en Cloudinary (Dashboard > Settings). No es secreto.
CLOUDINARY_CLOUD_NAME = "tu-cloud-name"

# Cron Triggers (los handlers se implementan en la Fase 4)
[triggers]
crons = ["*/15 * * * *", "0 * * * *", "0 10 * * *"]

# Rate limiting nativo de Workers
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Secretos (NO van aquí): wrangler secret put DATABASE_URL | JWT_SECRET | RESEND_API_KEY | CLOUDINARY_API_KEY | CLOUDINARY_API_SECRET
