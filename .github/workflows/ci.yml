name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          PUBLIC_API_URL: https://api.example.com

  deploy:
    name: Migrar y desplegar
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 1) Migraciones (conexión DIRECTA de Neon, no la pooled).
      - name: Migrar base de datos
        run: pnpm db:migrate:ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}

      # 2) API (Worker + cron + rate limiting del bloque [env.production] de wrangler.toml).
      - name: Verificar que wrangler.toml no tenga placeholders
        run: |
          if sed -n '/^\[env.production/,$p' apps/api/wrangler.toml | grep -v '^#' | grep -q '<'; then
            echo "::error::apps/api/wrangler.toml [env.production] aún tiene valores <…> sin reemplazar"; exit 1
          fi
      - name: Desplegar API
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 3) Web (Astro). Las PUBLIC_* se incrustan en el build: sin ellas la subida a
      #    Cloudinary y el SEO (canonical/sitemap) quedan apuntando a valores de desarrollo.
      - name: Compilar web
        run: pnpm --filter @prometeo/web build
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.PUBLIC_CLOUDINARY_CLOUD_NAME }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      - name: Desplegar web
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
